<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LearnPlay AI — learn Artificial Intelligence from A to Z with interactive demos, quizzes, XP and badges." />
    <meta name="theme-color" content="#6d28d9" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Apply the saved theme before first paint to avoid a light-mode flash.
      try {
        var t = (JSON.parse(localStorage.getItem('learnplay-ai:progress') || '{}').settings || {}).theme || 'system';
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <title>LearnPlay AI — Learn AI by Playing</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
